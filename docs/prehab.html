<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Marsala Volley — Protocollo Prehab Individuale</title>
  <meta name="theme-color" content="#060a14">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --mv-bg-dark:       #060a14;
      --mv-surface-card:  #090f1d;
      --mv-surface-hover: #0f172a;
      --mv-border:        #1e335a;
      --mv-border-subtle: rgba(255, 255, 255, 0.08);
      --mv-gold:          #f59e0b;
      --mv-gold-glow:     rgba(245, 158, 11, 0.2);
      --mv-gold-text:     #fde68a;
      --mv-emerald:       #10b981;
      --mv-emerald-bg:    rgba(16, 185, 129, 0.15);
      --mv-amber:         #f59e0b;
      --mv-amber-bg:      rgba(245, 158, 11, 0.15);
      --mv-coral:         #ef4444;
      --mv-cyan:          #38bdf8;
      --mv-text-primary:   #f8fafc;
      --mv-text-secondary: #cbd5e1;
      --mv-text-muted:     #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--mv-bg-dark);
      color: var(--mv-text-primary);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      padding-bottom: 50px;
    }

    /* TOP BAR */
    .top-bar {
      background: #0b132b;
      border-bottom: 1px solid var(--mv-border);
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .brand {
      font-size: 0.95rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand span {
      color: var(--mv-gold);
    }
    .top-actions {
      display: flex;
      gap: 8px;
    }
    .btn-top {
      background: #111a33;
      border: 1px solid var(--mv-border);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-top.print {
      background: var(--mv-gold);
      color: #060a14;
      border: none;
      font-weight: 800;
    }

    /* CONTAINER */
    .container {
      max-width: 820px;
      margin: 16px auto;
      padding: 0 14px;
    }

    /* BANNER ANAMNESI */
    .banner-anamnesi {
      background: #0c1630;
      border-left: 4px solid var(--mv-cyan);
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .banner-ath-name {
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
    }
    .banner-flags {
      font-size: 0.85rem;
      color: var(--mv-text-secondary);
      margin-top: 2px;
    }
    .volume-pill {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--mv-gold);
      color: var(--mv-gold-text);
      font-weight: 800;
      font-size: 0.82rem;
      padding: 4px 10px;
      border-radius: 6px;
      white-space: nowrap;
    }

    /* EXERCISE CARD */
    .ex-card {
      background: var(--mv-surface-card);
      border: 1px solid var(--mv-border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .ex-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--mv-border-subtle);
      margin-bottom: 14px;
    }
    .ex-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ex-num {
      background: #1e3a8a;
      color: #93c5fd;
      font-size: 0.8rem;
      font-weight: 900;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }
    .ex-name {
      font-size: 1rem;
      font-weight: 800;
      color: #ffffff;
    }
    .ex-target {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid var(--mv-cyan);
      color: #7dd3fc;
      font-family: monospace;
      font-weight: 800;
      font-size: 0.82rem;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .ex-grid {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 16px;
    }
    @media (max-width: 680px) {
      .ex-grid {
        grid-template-columns: 1fr;
      }
    }

    .visual-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .imgs-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: #040711;
      padding: 6px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .img-wrap {
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      aspect-ratio: 4/3;
      background: #000;
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .step-tag {
      position: absolute;
      top: 4px;
      left: 4px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 0.58rem;
      font-weight: 800;
      padding: 2px 4px;
      border-radius: 3px;
    }

    .btn-video {
      background: #111a33;
      border: 1px solid var(--mv-border);
      color: #38bdf8;
      font-weight: 800;
      font-size: 0.8rem;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-video:hover {
      background: #1e3a8a;
      color: #fff;
    }
    .btn-video.active {
      background: var(--mv-cyan);
      color: #04101e;
    }

    .video-container {
      margin-top: 8px;
      display: none;
      border-radius: 6px;
      overflow: hidden;
      aspect-ratio: 16/9;
      background: #000;
      border: 1px solid #1e335a;
    }
    .video-container video {
      width: 100%;
      height: 100%;
      display: block;
    }

    .info-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .desc-box {
      background: #0c1427;
      border-radius: 6px;
      padding: 8px 12px;
      border-left: 3px solid #38bdf8;
    }
    .desc-box.feel {
      border-left-color: #10b981;
    }
    .desc-box.comp {
      border-left-color: #f59e0b;
    }
    .desc-box-title {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .desc-box.how .desc-box-title { color: #7dd3fc; }
    .desc-box.feel .desc-box-title { color: #6ee7b7; }
    .desc-box.comp .desc-box-title { color: #fde68a; }
    .desc-box-p {
      font-size: 0.82rem;
      color: var(--mv-text-secondary);
      line-height: 1.4;
    }

    /* ERROR / EMPTY STATE */
    .not-found {
      text-align: center;
      padding: 60px 20px;
      color: var(--mv-text-muted);
    }

    /* MEDIA PRINT RULES */
    @media print {
      body {
        background: #fff !important;
        color: #000 !important;
        padding: 0 !important;
      }
      .top-bar, .btn-video, .video-container {
        display: none !important;
      }
      .container {
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .banner-anamnesi {
        background: #f8fafc !important;
        color: #000 !important;
        border: 1px solid #cbd5e1 !important;
        border-left: 4px solid #f59e0b !important;
      }
      .banner-ath-name { color: #000 !important; }
      .banner-flags { color: #475569 !important; }
      .ex-card {
        background: #fff !important;
        border: 1px solid #e2e8f0 !important;
        page-break-inside: avoid !important;
        margin-bottom: 12px !important;
      }
      .ex-name { color: #000 !important; }
      .ex-target {
        border-color: #cbd5e1 !important;
        color: #000 !important;
        background: #f1f5f9 !important;
      }
      .desc-box {
        background: #f8fafc !important;
      }
      .desc-box-p { color: #334155 !important; }
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="brand">
      🏐 MARSALA VOLLEY <span>PREHAB</span>
    </div>
    <div class="top-actions">
      <button class="btn-top" onclick="window.history.length > 1 ? window.history.back() : window.close()">← Chiudi</button>
      <button class="btn-top print" onclick="window.print()">🖨️ Stampa PDF</button>
    </div>
  </header>

  <main class="container" id="mainContainer">
    <div class="not-found" id="loadingState">Caricamento protocollo prehab...</div>
  </main>

  <script src="prehab_db.js"></script>
  <script>
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    function toggleVideo(idx) {
      const drawer = document.getElementById('vidDrawer_' + idx);
      const btn = document.getElementById('btnVid_' + idx);
      const vid = document.getElementById('vidEl_' + idx);
      if (!drawer) return;

      const isHidden = drawer.style.display === 'none' || !drawer.style.display;
      if (isHidden) {
        drawer.style.display = 'block';
        btn.classList.add('active');
        btn.innerHTML = '⏹ Chiudi Video';
        if (vid) vid.play();
      } else {
        drawer.style.display = 'none';
        btn.classList.remove('active');
        btn.innerHTML = '▶️ Guarda Video';
        if (vid) vid.pause();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const code = getQueryParam('code');
      const ath = getQueryParam('ath');

      let program = null;
      if (code) {
        program = getPrehabByCode(code);
      } else if (ath) {
        program = getPrehabByAthlete(ath);
      } else {
        // Default fallback sul primo atleta
        program = getPrehabByAthlete(1);
      }

      const container = document.getElementById('mainContainer');

      if (!program) {
        container.innerHTML = `
          <div class="not-found">
            <h2>Nessun Protocollo Trovato</h2>
            <p style="margin-top:8px;">Il codice '${code || ath}' non corrisponde ad alcuna seduta prehab registrata.</p>
          </div>
        `;
        return;
      }

      document.title = `#${program.athNum} ${program.athName} — Prehab Marsala Volley`;

      let html = `
        <section class="banner-anamnesi">
          <div>
            <div class="banner-ath-name">#${program.athNum} ${program.athName}</div>
            <div class="banner-flags">🛡️ <strong>Focus:</strong> ${program.flags}</div>
          </div>
          <div class="volume-pill">${program.volume || '3 serie'}</div>
        </section>

        <section class="exercises-list">
      `;

      html += program.exercises.map((ex, idx) => {
        const statLabel = ex.statType === 'Hold' ? 'Tenuta' : 'Reps';
        const img1 = ex.images && ex.images[0] ? ex.images[0] : '';
        const img2 = ex.images && ex.images[1] ? ex.images[1] : img1;

        return `
          <div class="ex-card">
            <div class="ex-header">
              <div class="ex-title-wrap">
                <span class="ex-num">${idx + 1}</span>
                <h3 class="ex-name">${ex.name}</h3>
              </div>
              <div class="ex-target">${statLabel}: ${ex.statVal}</div>
            </div>

            <div class="ex-grid">
              <div class="visual-col">
                <div class="imgs-pair">
                  <div class="img-wrap">
                    <span class="step-tag">STEP 1</span>
                    <img src="${img1}" alt="${ex.name} Step 1" loading="lazy">
                  </div>
                  <div class="img-wrap">
                    <span class="step-tag">STEP 2</span>
                    <img src="${img2}" alt="${ex.name} Step 2" loading="lazy">
                  </div>
                </div>

                ${ex.mp4 ? `
                  <button id="btnVid_${idx}" class="btn-video" onclick="toggleVideo(${idx})">
                    ▶️ Guarda Video
                  </button>
                  <div id="vidDrawer_${idx}" class="video-container">
                    <video id="vidEl_${idx}" src="${ex.mp4}" controls playsinline></video>
                  </div>
                ` : ''}
              </div>

              <div class="info-col">
                <div class="desc-box how">
                  <div class="desc-box-title">🎯 Come si esegue</div>
                  <div class="desc-box-p">${ex.how || 'Esecuzione controllata.'}</div>
                </div>
                <div class="desc-box feel">
                  <div class="desc-box-title">⚡ Sensazione Target</div>
                  <div class="desc-box-p">${ex.feel || 'Attivazione muscolare mirata.'}</div>
                </div>
                <div class="desc-box comp">
                  <div class="desc-box-title">⚠️ Errori da Evitare</div>
                  <div class="desc-box-p">${ex.comp || 'Evita compensi posturali.'}</div>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      html += '</section>';
      container.innerHTML = html;
    });
  </script>
</body>
</html>
