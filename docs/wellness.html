<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Marsala Volley — Reindirizzamento</title>
  <script>
    // Pulizia vecchie cache Service Worker e reindirizzamento immediato all'app unificata
    if ('caches' in window) {
      caches.keys().then(keys => keys.map(k => caches.delete(k)));
    }
    const params = window.location.search;
    window.location.replace('./' + params);
  </script>
</head>
<body style="background:#071226;color:#fff;text-align:center;padding-top:50px;font-family:sans-serif;">
  <p>Caricamento app ufficiale in corso...</p>
</body>
</html>
