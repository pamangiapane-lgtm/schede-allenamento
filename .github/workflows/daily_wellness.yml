name: Daily Morning Wellness Dispatch

on:
  schedule:
    # 06:30 UTC = 08:30 CEST (Ora di Roma)
    - cron: '30 6 * * *'
  workflow_dispatch: # Permette l'esecuzione manuale con 1 click

jobs:
  dispatch-wellness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pywebpush requests

      - name: Run Morning Wellness Dispatcher
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN || 'mv26-prd-3xF7wNqK' }}
        run: |
          python _strumenti/invia_wellness_giornaliero.py
