name: Daily WhatsApp Wellness Report

on:
  workflow_dispatch: # Invocabile manualmente o via webhook
  schedule:
    - cron: '30 8 * * *' # 08:30 UTC = 10:30 CEST (Fuso orario italiano estivo)

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          pip install requests pillow


      - name: Generate & Send Wellness Report
        working-directory: ./_strumenti
        env:
          GREEN_API_INSTANCE: ${{ secrets.GREEN_API_INSTANCE || '710522726817' }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN || '6bc94d387d5742a3ad17e1225270479a67d4debd7dfa4863ab' }}
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID || '120363408483842576@g.us' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python invia_whatsapp_automatico.py

