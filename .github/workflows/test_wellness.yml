name: Test Pipeline Wellness

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/pre-season-app-mods-355hqq

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install requests

      - name: Test pipeline GAS + PushSub
        run: python _strumenti/test_wellness_pipeline.py
