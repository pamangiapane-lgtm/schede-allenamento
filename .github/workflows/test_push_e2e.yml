name: Test Push E2E
on:
  workflow_dispatch:

jobs:
  test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze Python
        run: pip install pywebpush requests

      - name: Installa Playwright + Chromium
        run: |
          npm install -D playwright @playwright/test
          npx playwright install chromium --with-deps

      - name: Sottoscrivi push e ottieni subscription
        run: |
          cat > get_sub.js << 'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              permissions: ['notifications'],
            });

            const page = await context.newPage();

            // Intercetta console
            page.on('console', msg => console.log('[PAGE]', msg.text()));

            await page.goto('https://pamangiapane-lgtm.github.io/schede-allenamento/?id=1', {
              waitUntil: 'networkidle',
              timeout: 30000
            });

            // Aspetta service worker
            await page.waitForTimeout(3000);

            // Prova a sottoscrivere via JS
            const sub = await page.evaluate(async () => {
              const VAPID_PUBLIC = 'BHVZrGFRPQlFqKnhSyIolSkeo4uzTupre9kjmh7fhCNG5DwenXry9qzxpb8ZrCG0RBdXKPNHPrPnOfi444Zgg08';
              function urlBase64ToUint8Array(b64) {
                const pad = '='.repeat((4 - b64.length % 4) % 4);
                const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
                return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
              }
              try {
                const reg = await navigator.serviceWorker.ready;
                let sub = await reg.pushManager.getSubscription();
                if (!sub) {
                  sub = await reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC)
                  });
                }
                return sub ? sub.toJSON() : null;
              } catch(e) {
                return { error: e.message };
              }
            });

            console.log('SUBSCRIPTION:', JSON.stringify(sub));

            await browser.close();

            if (sub && sub.endpoint) {
              const fs = require('fs');
              fs.writeFileSync('test_sub.json', JSON.stringify(sub));
              console.log('Endpoint:', sub.endpoint.substring(0, 60) + '...');
              console.log('p256dh:', (sub.keys?.p256dh || '').substring(0, 30) + '...');
              process.exit(0);
            } else {
              console.error('Nessuna subscription valida:', JSON.stringify(sub));
              process.exit(1);
            }
          })();
          EOF
          node get_sub.js

      - name: Invia push di test e verifica 201
        run: |
          cat > send_test.py << 'EOF'
          import json, sys
          from pywebpush import webpush, WebPushException

          VAPID_PRIVATE_KEY = 'uAbznecLD_rYJcda0RuvKCELWNkbmeHtRfbTr96D2C0'
          VAPID_CLAIMS = {'sub': 'mailto:pamangiapane@gmail.com'}

          with open('test_sub.json') as f:
              sub = json.load(f)

          print(f"Endpoint: {sub['endpoint'][:60]}...")
          print(f"p256dh: {sub['keys']['p256dh'][:30]}...")

          payload = json.dumps({
              'title': '✅ Test E2E Push OK',
              'body': 'Sistema wellness operativo al 100%',
              'url': 'https://pamangiapane-lgtm.github.io/schede-allenamento/',
              'id': '1'
          })

          try:
              resp = webpush(
                  subscription_info={
                      'endpoint': sub['endpoint'],
                      'keys': sub['keys']
                  },
                  data=payload,
                  vapid_private_key=VAPID_PRIVATE_KEY,
                  vapid_claims=VAPID_CLAIMS
              )
              status = resp.status_code if hasattr(resp, 'status_code') else 'OK'
              print(f'✅ Push inviata con successo! Status: {status}')
              print('🎉 SISTEMA WELLNESS OPERATIVO AL 100%')
              sys.exit(0)
          except WebPushException as ex:
              status = getattr(ex.response, 'status_code', None) if ex.response else None
              print(f'❌ WebPushException: {ex} (status={status})')
              sys.exit(1)
          except Exception as ex:
              print(f'❌ Errore: {ex}')
              sys.exit(1)
          EOF
          python send_test.py
