name: Deploy to GitHub Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-build

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-build

      - name: Prepara cartella pubblicazione
        run: |
          cp -r main-build site
          rm -rf site/.github site/backup_locale site/apps_script_prod_project site/apps_script_dev_project site/_strumenti site/dev
          mkdir -p site/dev
          cp -r dev-build/* site/dev/
          rm -rf site/dev/.git site/dev/.github site/dev/backup_locale site/dev/apps_script_prod_project site/dev/apps_script_dev_project site/dev/_strumenti
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
