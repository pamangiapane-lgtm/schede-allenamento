name: Notifica Wellness Mattutina

on:
  schedule:
    # 08:45 CEST (UTC+2) — preseason estate
    # In inverno (CET = UTC+1) cambiare in '45 7 * * *'
    - cron: '45 6 * * *'
  workflow_dispatch:    # permette esecuzione manuale da GitHub UI

jobs:
  invia-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/pre-season-app-mods-355hqq

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install pywebpush requests

      - name: Invia notifiche wellness
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: python _strumenti/invia_wellness.py
