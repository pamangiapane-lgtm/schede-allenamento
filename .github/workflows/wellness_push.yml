name: Notifica Wellness Mattutina

on:
  workflow_dispatch: # Invocato da cron-job.org ogni mattina alle 08:30 / 08:45 CEST


jobs:
  invia-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4


      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: pip install pywebpush requests

      - name: Invia notifiche wellness
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: python _strumenti/invia_wellness.py
