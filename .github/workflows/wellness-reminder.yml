name: Wellness Reminder Push

on:
  schedule:
    # 8:45 CEST (UTC+2) — valido per preseason estate (ago-ott)
    # In inverno (CET = UTC+1) cambiare in '45 7 * * *'
    - cron: '45 6 * * *'
  workflow_dispatch:   # permette test manuale dalla UI di GitHub

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .github/scripts/package.json

      - name: Installa dipendenze
        run: npm install
        working-directory: .github/scripts

      - name: Invia notifiche wellness
        run: node wellness-notify.js
        working-directory: .github/scripts
        env:
          VAPID_PRIVATE_KEY:   ${{ secrets.VAPID_PRIVATE_KEY }}
          APPS_SCRIPT_URL:     ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN:   ${{ secrets.APPS_SCRIPT_TOKEN }}
          PUSH_SUBSCRIPTIONS:  ${{ secrets.PUSH_SUBSCRIPTIONS }}
