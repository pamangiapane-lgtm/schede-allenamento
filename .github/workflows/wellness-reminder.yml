name: Wellness Reminder Email

on:
  schedule:
    # 8:45 CEST (UTC+2) — valido ago-ott; in inverno (CET) cambia in '45 7 * * *'
    - cron: '45 6 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: .github/scripts/package.json

      - name: Installa dipendenze
        run: npm install
        working-directory: .github/scripts

      - name: Invia email wellness
        run: node wellness-email.js
        working-directory: .github/scripts
        env:
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          APPS_SCRIPT_URL:     ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN:   ${{ secrets.APPS_SCRIPT_TOKEN }}
