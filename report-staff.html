<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Report Staff · Marsala Volley Pre-Season 2026/27</title>
<style>
:root{
  --bg:#f0f4f8;--card:#fff;--border:#dde3ec;--navy:#1a3a6b;
  --text:#1e293b;--muted:#64748b;--faint:#94a3b8;
  --green:#16a34a;--amber:#d97706;--red:#dc2626;
  --accent-bg:#eff6ff;--tab-active:#fff;
  --header-gradient:linear-gradient(135deg,#1a3a6b 0%,#2563eb 100%);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0d1827;--card:#1a2640;--border:#2a3a55;--navy:#93c5fd;
  --text:#e2e8f0;--muted:#94a3b8;--faint:#4a6080;
  --accent-bg:#162035;--tab-active:#1a2640;
  --header-gradient:linear-gradient(135deg,#0d1827 0%,#1a3a6b 100%);
}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;min-height:100vh}

/* HEADER */
.header{background:var(--header-gradient);color:#fff;padding:20px 28px 0}
.header-top{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-bottom:18px}
.header-eyebrow{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;opacity:.55;margin-bottom:4px}
.header h1{font-size:1.3rem;font-weight:700}
.header-sub{font-size:.72rem;opacity:.6;margin-top:3px}
.live-badge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:4px 11px;border-radius:20px;font-size:.65rem;font-weight:600;letter-spacing:.04em}
.refresh-hint{font-size:.6rem;color:rgba(255,255,255,.45);margin-top:6px;text-align:right}

/* TABS */
.week-tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;padding-top:2px}
.week-tabs::-webkit-scrollbar{display:none}
.tab-btn{background:rgba(255,255,255,.08);border:none;border-bottom:none;border-radius:8px 8px 0 0;color:rgba(255,255,255,.6);padding:8px 18px;font-size:.75rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0;position:relative;top:1px}
.tab-btn.active{background:var(--tab-active);color:var(--navy);border-top:2px solid #3b82f6}
.tab-btn:not(.active):hover{background:rgba(255,255,255,.15);color:#fff}
.tab-btn.empty{opacity:.4;cursor:default}

/* LAYOUT */
.page{max-width:1040px;margin:0 auto;padding:20px 16px 56px}

/* LOADING */
.loading-state{text-align:center;padding:64px 24px;color:var(--faint)}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin .65s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-state{text-align:center;padding:64px 24px}
.retry-btn{margin-top:14px;padding:8px 18px;border-radius:6px;border:none;background:var(--navy);color:#fff;cursor:pointer;font-size:.82rem;font-weight:600}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.kpi-label{font-size:.58rem;font-weight:700;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.kpi-val{font-size:1.65rem;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1}
.kpi-sub{font-size:.63rem;color:var(--muted);margin-top:3px}

/* SECTIONS */
.section{margin-bottom:18px}
.s-title{font-size:.58rem;font-weight:700;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
thead{background:var(--accent-bg)}
th{font-size:.58rem;font-weight:700;color:var(--faint);letter-spacing:.07em;text-transform:uppercase;padding:9px 11px;text-align:left;white-space:nowrap}
th.r{text-align:center}
td{padding:8px 11px;border-top:1px solid var(--border);font-size:.76rem;vertical-align:top}
td.r{text-align:center;font-variant-numeric:tabular-nums}
tr:hover td{background:var(--accent-bg)}

/* CHIPS */
.chip{display:inline-block;padding:2px 7px;border-radius:4px;font-size:.65rem;font-weight:700}
.chip-h{background:#dcfce7;color:#15803d}
.chip-m{background:#fef9c3;color:#854d0e}
.chip-l{background:#fee2e2;color:#991b1b}
.chip-z{background:var(--border);color:var(--faint)}

/* RPE colors */
.rpe-lo{color:var(--green);font-weight:700}
.rpe-mi{color:var(--amber);font-weight:700}
.rpe-hi{color:var(--red);font-weight:700}

/* NOTE */
.note{font-size:.68rem;color:var(--text);line-height:1.45;min-width:160px;max-width:240px}

/* ALERTS */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{background:var(--card);border:1px solid var(--border);border-left:3px solid;border-radius:0 8px 8px 0;padding:10px 13px}
.al-r{border-left-color:var(--red)}.al-a{border-left-color:var(--amber)}.al-g{border-left-color:var(--green)}
.alert-t{font-weight:700;font-size:.76rem;margin-bottom:2px}
.alert-b{font-size:.7rem;color:var(--muted)}

/* WELLNESS */
.well-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.wc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.wc-name{font-weight:600;font-size:.8rem;margin-bottom:2px}
.wc-date{font-size:.62rem;color:var(--muted)}
.wbars{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.brow{display:flex;align-items:center;gap:7px;font-size:.67rem;color:var(--muted)}
.blbl{width:60px;flex-shrink:0}
.btrack{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.bfill{height:100%;border-radius:3px}
.wnote{margin-top:7px;font-size:.66rem;color:var(--amber);font-style:italic;border-top:1px solid var(--border);padding-top:5px}

/* EMPTY WEEK */
.empty-week{text-align:center;padding:64px 24px;color:var(--faint)}
.empty-week svg{opacity:.25;margin-bottom:14px}
.empty-week h3{font-size:1rem;font-weight:600;color:var(--muted);margin-bottom:6px}
.empty-week p{font-size:.78rem}

/* FOOTER */
.footer{text-align:center;font-size:.62rem;color:var(--faint);margin-top:28px;border-top:1px solid var(--border);padding-top:12px;padding-bottom:20px}

@media(max-width:600px){
  .header{padding:16px 16px 0}
  .kpi-row{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="header-eyebrow">Marsala Volley · Staff Report</div>
      <h1>Pre-Season 2026/27</h1>
      <div class="header-sub" id="hdr-sub">Connessione al database...</div>
    </div>
    <div style="text-align:right">
      <div class="live-badge" id="live-badge">⟳ Caricamento</div>
      <div class="refresh-hint">Aggiornamento automatico<br>domenica · ore 12:00</div>
    </div>
  </div>
  <div class="week-tabs" id="week-tabs">
    <div style="padding:8px 18px;color:rgba(255,255,255,.4);font-size:.75rem">Caricamento settimane...</div>
  </div>
</div>

<div class="page" id="page">
  <div class="loading-state">
    <div class="spinner"></div>
    <p style="font-size:.82rem">Connessione al database...</p>
  </div>
</div>

<div class="footer">
  Marsala Volley 2026/27 · Dati live da PROD · Aggiornamento automatico domenica ore 12:00 · Solo lettura
</div>

<script>
const API   = 'https://script.google.com/macros/s/AKfycbyxLzbnm_LcBDYrB1_hBdCD6HxvOxA7__lXHe7_xmbe2kynoGNA_oDDh954zR3RIzr9/exec';
const TOKEN = 'mv26-prd-3xF7wNqK';
const SKIP  = new Set(['RPE-seduta','Fatica-seduta','Peso-corporeo']);

// Pre-season W1 = settimana dal lun 6 luglio 2026
const W1_START    = new Date(2026, 6, 6); // mesi 0-indexed: 6 = luglio
const TOTAL_WEEKS = 7;

let giocatrici = [], progressi = [], wellness = [], noteCoach = [];
let weekCache  = {}; // cache HTML per settimana già renderizzata
let activeWeek = 1;

// ─── Week helpers ─────────────────────────────────────────────────────────────

function weekBounds(w) {
  const start = new Date(W1_START);
  start.setDate(start.getDate() + (w - 1) * 7);
  const end = new Date(start);
  end.setDate(end.getDate() + 7);
  return { start, end };
}

function currentWeekNum() {
  const diff = Date.now() - W1_START.getTime();
  if (diff < 0) return 1;
  return Math.min(Math.floor(diff / (7 * 86400000)) + 1, TOTAL_WEEKS);
}

function weekLabel(w) {
  const { start, end } = weekBounds(w);
  const last = new Date(end.getTime() - 86400000);
  const s = start.toLocaleDateString('it-IT', { day:'numeric', month:'short' });
  const e = last.toLocaleDateString('it-IT', { day:'numeric', month:'short' });
  return `${s} – ${e}`;
}

function isWeekPast(w) {
  return Date.now() >= weekBounds(w).end.getTime();
}

// ─── API ─────────────────────────────────────────────────────────────────────

function apiFetch(params) {
  return fetch(API + '?' + new URLSearchParams({ token: TOKEN, ...params })).then(r => r.json());
}

// ─── Metrics ─────────────────────────────────────────────────────────────────

function athleteMetrics(id, w) {
  const { start, end } = weekBounds(w);
  const sid = String(id);

  const progs = progressi.filter(p => {
    if (String(p.ID_Giocatrice) !== sid) return false;
    const ts = p.Timestamp ? new Date(p.Timestamp) : null;
    return ts && ts >= start && ts < end && String(p.N_Seduta) !== '0';
  });

  const sedSet = new Set(
    progs.filter(p => !SKIP.has(p.Esercizio) && p.N_Seduta)
         .map(p => String(p.N_Seduta))
  );

  const rpeVals = progs.filter(p => p.Esercizio === 'RPE-seduta')
    .map(p => Number(p.Valore)).filter(v => v > 0);
  const fatVals = progs.filter(p => p.Esercizio === 'Fatica-seduta')
    .map(p => Number(p.Valore)).filter(v => v > 0);

  const wRows = wellness.filter(r => {
    if (String(r.ID_Giocatrice) !== sid) return false;
    const ts = r.Timestamp ? new Date(r.Timestamp) : null;
    return ts && ts >= start && ts < end;
  });

  const avgW = field => {
    const vals = wRows.map(r => Number(r[field])).filter(v => v > 0);
    return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
  };

  const lastWNote = [...wRows]
    .sort((a,b) => new Date(a.Timestamp)-new Date(b.Timestamp))
    .map(r => r.Note).filter(Boolean).pop() || null;

  return {
    sedSet: [...sedSet].sort((a,b) => {
      const na=parseInt(a), nb=parseInt(b);
      return isNaN(na)||isNaN(nb) ? a.localeCompare(b) : na-nb;
    }),
    rpe:     rpeVals.length ? rpeVals.reduce((a,b)=>a+b,0)/rpeVals.length : null,
    fat:     fatVals.length ? fatVals.reduce((a,b)=>a+b,0)/fatVals.length : null,
    sonno:   avgW('Qualita_Sonno'),
    dolori:  avgW('Dolori'),
    energia: avgW('Energia'),
    wNote:   lastWNote,
    hasWellness: wRows.length > 0,
  };
}

// RPE per singola seduta: {athleteId -> {sessionId -> valore}}
function buildRpeMap(w) {
  const { start, end } = weekBounds(w);
  const map = {};
  progressi.forEach(p => {
    if (p.Esercizio !== 'RPE-seduta') return;
    const ts = p.Timestamp ? new Date(p.Timestamp) : null;
    if (!ts || ts < start || ts >= end) return;
    const aid = String(p.ID_Giocatrice);
    const sid = String(p.N_Seduta);
    if (!map[aid]) map[aid] = {};
    map[aid][sid] = Number(p.Valore);
  });
  return map;
}

function weekSessions(w) {
  const { start, end } = weekBounds(w);
  const sess = new Set();
  progressi.forEach(p => {
    if (!p.Timestamp || SKIP.has(p.Esercizio) || !p.N_Seduta || p.N_Seduta === '0') return;
    const ts = new Date(p.Timestamp);
    if (ts >= start && ts < end) sess.add(String(p.N_Seduta));
  });
  return [...sess].sort((a,b) => {
    const na=parseInt(a), nb=parseInt(b);
    return isNaN(na)||isNaN(nb) ? a.localeCompare(b) : na-nb;
  });
}

function getNoteForWeek(id, w) {
  // Snapshot: usa nota di approvazione + notaCoach snapshot
  if (w === currentWeekNum() && approvedSnapshot) {
    const sid    = String(id);
    const atleta = approvedSnapshot.data.atleti.find(a => a.id === sid);
    const parts  = [];
    const approvalNote = approvedSnapshot.noteAtleta[sid];
    if (approvalNote) parts.push(approvalNote);
    if (atleta?.notaCoach) parts.push(atleta.notaCoach);
    return parts.join('\n\n') || null;
  }
  // Live: cerca in noteCoach per settimana
  const { start, end } = weekBounds(w);
  const sid = String(id);
  const match = noteCoach
    .filter(n => {
      if (String(n.id_giocatrice) !== sid) return false;
      if (!['generale','settimanale'].includes(n.tipo)) return false;
      const di = n.data_inizio ? new Date(n.data_inizio) : null;
      return di && di >= start && di < end;
    })
    .sort((a,b) => new Date(b.data_inizio)-new Date(a.data_inizio))[0];
  return match ? match.testo : null;
}

// ─── Utilities ────────────────────────────────────────────────────────────────

function f1(v) { return (v !== null && v !== undefined && !isNaN(v)) ? Number(v).toFixed(1) : '—'; }
function esc(s) {
  return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function rpeClass(v) {
  if (v === null || isNaN(v)) return '';
  if (v >= 7.5) return 'rpe-hi';
  if (v >= 5.5) return 'rpe-mi';
  return 'rpe-lo';
}
function chipClass(n) {
  if (n === 0) return 'chip-z';
  if (n >= 3)  return 'chip-h';
  return 'chip-m';
}
function truncate(s, n) {
  if (!s) return '';
  return s.length > n ? s.substring(0, n) + '…' : s;
}

// ─── Render week ──────────────────────────────────────────────────────────────

function renderWeek(w) {
  const currW   = currentWeekNum();
  const past    = isWeekPast(w);
  const useSnap = (w === currW && approvedSnapshot !== null);

  // Settimana corrente senza snapshot approvato → "In aggiornamento"
  if (w === currW && !approvedSnapshot) {
    const isSunday = new Date().getDay() === 0;
    return `<div class="empty-week">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
      </svg>
      <h3>Report W${w} · ${weekLabel(w)}</h3>
      <p>${isSunday ? 'Il report è in attesa di approvazione — disponibile dopo la conferma del coach.' : 'Il report sarà disponibile dopo l\'approvazione domenicale del coach.'}</p>
    </div>`;
  }

  let allAtlete = giocatrici.filter(g => String(g.ID) !== '99');
  let sessions, rpeMap;

  // Calcolo metriche per ogni atleta
  const mMap = {};
  let totalSed = 0, rpeVals = [], fatVals = [], alertDolori = 0, activeCount = 0;

  if (useSnap) {
    // Usa dati snapshot: filtra atleti nascosti, usa metriche pre-calcolate
    const hidden = new Set(approvedSnapshot.atletiNascosti);
    allAtlete = allAtlete.filter(g => !hidden.has(String(g.ID)));
    sessions  = [...new Set(approvedSnapshot.data.atleti.flatMap(a => a.sedute))].sort();
    rpeMap    = {};
    for (const a of approvedSnapshot.data.atleti) {
      mMap[a.id] = { sedSet: a.sedute, rpe: a.rpe, fat: a.fat, sonno: a.sonno, dolori: a.dolori, energia: a.energia, hasWellness: a.hasWellness, wNote: a.wNote || '' };
      rpeMap[a.id] = {};
    }
  } else {
    sessions = weekSessions(w);
    rpeMap   = buildRpeMap(w);
    for (const g of allAtlete) {
      const m = athleteMetrics(g.ID, w);
      mMap[String(g.ID)] = m;
    }
  }

  for (const g of allAtlete) {
    const m = mMap[String(g.ID)];
    if (!m) continue;
    if (m.sedSet.length > 0) { activeCount++; totalSed += m.sedSet.length; }
    if (m.rpe    !== null) rpeVals.push(m.rpe);
    if (m.fat    !== null) fatVals.push(m.fat);
    if (m.dolori !== null && m.dolori >= 3.5) alertDolori++;
  }

  const atlete = allAtlete;

  // Settimana senza dati
  if (totalSed === 0 && !mMap[String(atlete[0]?.ID)]?.hasWellness && w > currW) {
    return `<div class="empty-week">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
      </svg>
      <h3>Settimana ${w} · ${weekLabel(w)}</h3>
      <p>Dati disponibili a partire da questa settimana.</p>
    </div>`;
  }

  const rpeMedia = rpeVals.length ? rpeVals.reduce((a,b)=>a+b,0)/rpeVals.length : null;
  const fatMedia = fatVals.length ? fatVals.reduce((a,b)=>a+b,0)/fatVals.length : null;
  const compliance = atlete.length > 0 ? Math.round(totalSed / (atlete.length * 3) * 100) : 0;

  let html = '';

  // ── Banner snapshot ──
  if (useSnap) {
    const ts = approvedSnapshot.timestampApprovazione
      ? new Date(approvedSnapshot.timestampApprovazione).toLocaleString('it-IT', { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })
      : '';
    html += `<div class="section"><div class="alert al-g" style="border-left-color:var(--green)">
      <div class="alert-t" style="color:var(--green)">Report approvato${ts ? ' · ' + ts : ''}</div>
      <div class="alert-b">Snapshot settimanale verificato dal coach. I dati riportati si riferiscono alla settimana W${w}.</div>
    </div></div>`;
    if (approvedSnapshot.notaGenerale) {
      html += `<div class="section"><div class="alert al-a">
        <div class="alert-t">Nota coach — W${w}</div>
        <div class="alert-b">${esc(approvedSnapshot.notaGenerale)}</div>
      </div></div>`;
    }
  }

  // ── KPI ──
  html += `<div class="kpi-row">
    <div class="kpi">
      <div class="kpi-label">Sedute</div>
      <div class="kpi-val">${totalSed}</div>
      <div class="kpi-sub">${activeCount} atlete attive</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">RPE medio</div>
      <div class="kpi-val">${f1(rpeMedia)}</div>
      <div class="kpi-sub">scala 1–10</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Fatica media</div>
      <div class="kpi-val">${f1(fatMedia)}</div>
      <div class="kpi-sub">scala 1–5</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Compliance</div>
      <div class="kpi-val">${compliance}%</div>
      <div class="kpi-sub">sed. log / attese</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Alert dolori</div>
      <div class="kpi-val" style="color:${alertDolori>0?'var(--red)':'var(--green)'}">${alertDolori}</div>
      <div class="kpi-sub">${alertDolori>0?'dolori ≥ 3.5/5':'nessuno'}</div>
    </div>
  </div>`;

  // ── Tabella atlete ──
  const showSed = sessions.length > 0 ? sessions : ['1','2','3'];
  const sedCols = showSed.map(s => {
    const label = /^\d+$/.test(s) ? `S${s}` : s;
    return `<th class="r">${label}</th>`;
  }).join('');

  html += `<div class="section">
    <div class="s-title">Atlete · Settimana ${w} · ${weekLabel(w)}</div>
    <div class="tbl-wrap"><table>
      <thead><tr>
        <th>Atleta</th><th class="r">Sed.</th>${sedCols}
        <th class="r">RPE</th><th class="r">Fatica</th><th class="r">Dolori</th><th>Nota coach</th>
      </tr></thead>
      <tbody>`;

  for (const g of atlete) {
    const m    = mMap[String(g.ID)];
    const name = `${g.Nome} ${g.Cognome||''}`.trim();
    const nota = getNoteForWeek(g.ID, w);
    const hasData = m.sedSet.length > 0 || m.hasWellness;

    if (!hasData) {
      const msg = past ? 'nessuna seduta registrata' : 'nessun dato questa settimana';
      html += `<tr>
        <td style="font-weight:600;color:var(--faint)">${esc(name)}</td>
        <td class="r"><span class="chip chip-z">0</span></td>
        <td class="r" colspan="${showSed.length+3}" style="color:var(--faint);font-style:italic;font-size:.7rem">${msg}</td>
        <td><div class="note">${esc(truncate(nota,140))}</div></td>
      </tr>`;
      continue;
    }

    const sedCells = showSed.map(s => {
      if (!m.sedSet.includes(s)) return `<td class="r" style="color:var(--faint)">—</td>`;
      const rpe = rpeMap[String(g.ID)]?.[s];
      if (rpe !== null && rpe !== undefined && rpe >= 7) {
        return `<td class="r" style="color:var(--amber)">✓ RPE${rpe}</td>`;
      }
      return `<td class="r" style="color:var(--green)">✓</td>`;
    }).join('');

    const doloriStyle = m.dolori !== null && m.dolori >= 3.5
      ? 'style="color:var(--red);font-weight:700"' : '';

    html += `<tr>
      <td style="font-weight:600">${esc(name)}</td>
      <td class="r"><span class="chip ${chipClass(m.sedSet.length)}">${m.sedSet.length}</span></td>
      ${sedCells}
      <td class="r ${rpeClass(m.rpe)}">${f1(m.rpe)}</td>
      <td class="r">${f1(m.fat)}</td>
      <td class="r" ${doloriStyle}>${f1(m.dolori)}</td>
      <td><div class="note">${esc(truncate(nota,140))}</div></td>
    </tr>`;
  }

  html += '</tbody></table></div></div>';

  // ── Osservazioni automatiche ──
  const alerts = [];
  for (const g of atlete) {
    const m    = mMap[String(g.ID)];
    const name = `${g.Nome} ${g.Cognome||''}`.trim();

    if (m.dolori !== null && m.dolori >= 4)
      alerts.push({ l:'r', t:`${name} — Dolori ${f1(m.dolori)}/5`, b:`Valore sopra la media del gruppo questa settimana.` });
    if (m.rpe !== null && m.rpe >= 7.5)
      alerts.push({ l:'r', t:`${name} — RPE medio ${f1(m.rpe)}/10`, b:`Carico percepito nella parte alta della scala per questa settimana.` });
    if (m.sonno !== null && m.sonno < 3 && m.hasWellness)
      alerts.push({ l:'a', t:`${name} — Qualità sonno ${f1(m.sonno)}/5`, b:`Inferiore alla media del gruppo questa settimana.` });
    if (m.rpe !== null && m.rpe >= 6.5 && m.rpe < 7.5)
      alerts.push({ l:'a', t:`${name} — RPE ${f1(m.rpe)}/10`, b:`Carico percepito nella parte medio-alta questa settimana.` });
    if (m.sedSet.length === 0 && past)
      alerts.push({ l:'a', t:`${name} — Nessuna seduta registrata in W${w}`, b:`Nessun dato disponibile per questa settimana.` });
    else if (m.sedSet.length === 1 && past)
      alerts.push({ l:'a', t:`${name} — 1 seduta registrata questa settimana`, b:`Dato parziale rispetto alle sedute previste.` });
    else if (m.sedSet.length >= 3)
      alerts.push({ l:'g', t:`${name} — ${m.sedSet.length} sedute registrate questa settimana`, b:`Tutte le sedute previste completate.` });
  }

  if (alerts.length > 0) {
    html += `<div class="section"><div class="s-title">Note settimana W${w}</div><div class="alerts">`;
    alerts.forEach(a => {
      html += `<div class="alert al-${a.l}">
        <div class="alert-t">${esc(a.t)}</div>
        <div class="alert-b">${esc(a.b)}</div>
      </div>`;
    });
    html += '</div></div>';
  }

  // ── Wellness grid ──
  const withWellness = atlete.filter(g => mMap[String(g.ID)].hasWellness);
  if (withWellness.length > 0) {
    html += `<div class="section"><div class="s-title">Wellness · ${weekLabel(w)}</div><div class="well-grid">`;
    for (const g of withWellness) {
      const m    = mMap[String(g.ID)];
      const name = `${g.Nome} ${g.Cognome||''}`.trim();
      const sw   = m.sonno   !== null ? (m.sonno   / 5 * 100).toFixed(0) : 0;
      const dw   = m.dolori  !== null ? (m.dolori  / 5 * 100).toFixed(0) : 0;
      const ew   = m.energia !== null ? (m.energia / 5 * 100).toFixed(0) : 0;
      const dc   = m.dolori  !== null && m.dolori >= 3.5 ? 'var(--red)' : m.dolori >= 2 ? 'var(--amber)' : 'var(--green)';
      const hasDAlert = m.dolori !== null && m.dolori >= 3.5;
      const hasSAlert = m.sonno  !== null && m.sonno < 3;
      const border = hasDAlert ? 'border-color:var(--red);border-width:2px'
                   : hasSAlert ? 'border-color:var(--amber);border-width:2px' : '';
      const badge  = hasDAlert
        ? `<span style="background:#fee2e2;color:#991b1b;font-size:.58rem;padding:1px 5px;border-radius:3px;font-weight:600;margin-left:3px">dolori ↑</span>`
        : hasSAlert
        ? `<span style="background:#fef3c7;color:#78350f;font-size:.58rem;padding:1px 5px;border-radius:3px;font-weight:600;margin-left:3px">sonno ↓</span>`
        : '';

      html += `<div class="wc" style="${border}">
        <div class="wc-name">${esc(name)} ${badge}</div>
        <div class="wc-date">media settimana</div>
        <div class="wbars">
          <div class="brow"><span class="blbl">Sonno</span>
            <div class="btrack"><div class="bfill" style="width:${sw}%;background:#3b82f6"></div></div>
            <span>${f1(m.sonno)}/5</span></div>
          <div class="brow"><span class="blbl">Dolori</span>
            <div class="btrack"><div class="bfill" style="width:${dw}%;background:${dc}"></div></div>
            <span>${f1(m.dolori)}/5</span></div>
          <div class="brow"><span class="blbl">Energia</span>
            <div class="btrack"><div class="bfill" style="width:${ew}%;background:var(--green)"></div></div>
            <span>${f1(m.energia)}/5</span></div>
        </div>
        ${m.wNote ? `<div class="wnote">💬 "${esc(m.wNote)}"</div>` : ''}
      </div>`;
    }
    html += '</div></div>';
  }

  return html;
}

// ─── Tabs & navigation ────────────────────────────────────────────────────────

function showWeek(w) {
  activeWeek = w;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById(`tab-w${w}`);
  if (btn) btn.classList.add('active');

  if (!weekCache[w]) weekCache[w] = renderWeek(w);
  document.getElementById('page').innerHTML = weekCache[w];
}

function renderTabs() {
  const currW = currentWeekNum();
  let html = '';
  for (let w = 1; w <= TOTAL_WEEKS; w++) {
    const empty = w > currW ? 'empty' : '';
    const onclick = w > currW ? '' : `onclick="showWeek(${w})"`;
    html += `<button class="tab-btn ${empty}" id="tab-w${w}" ${onclick}>W${w} · ${weekLabel(w)}</button>`;
  }
  document.getElementById('week-tabs').innerHTML = html;
  showWeek(currW);
}

// ─── Auto-refresh domenica ore 12:00 ─────────────────────────────────────────

function scheduleRefresh() {
  const now = new Date();
  const day = now.getDay(); // 0=Dom
  let daysAdd;
  if (day === 0) {
    daysAdd = now.getHours() < 12 ? 0 : 7; // oggi se prima delle 12, altrimenti prossima dom
  } else {
    daysAdd = 7 - day;
  }
  const next = new Date(now);
  next.setDate(now.getDate() + daysAdd);
  next.setHours(12, 0, 0, 0);
  const delay = next.getTime() - now.getTime();
  if (delay > 0) {
    setTimeout(() => location.reload(), delay);
  }
}

function lastSundayNoon() {
  const now = new Date();
  const day = now.getDay();
  let daysBack;
  if (day === 0 && now.getHours() >= 12) daysBack = 0;
  else if (day === 0) daysBack = 7;
  else daysBack = day;
  const last = new Date(now);
  last.setDate(now.getDate() - daysBack);
  last.setHours(12, 0, 0, 0);
  return last;
}

// ─── Init ─────────────────────────────────────────────────────────────────────

let approvedSnapshot = null; // snapshot approvato per la settimana corrente

async function init() {
  document.getElementById('page').innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <p style="font-size:.82rem">Connessione al database...</p>
    </div>`;
  document.getElementById('live-badge').textContent = '⟳ Caricamento';
  weekCache = {};
  approvedSnapshot = null;

  try {
    const curW = currentWeekNum();
    const [rg, rp, rw, rn, rs] = await Promise.all([
      apiFetch({ azione:'leggi', foglio:'Giocatrici' }),
      apiFetch({ azione:'leggi', foglio:'Progressi'  }),
      apiFetch({ azione:'leggi', foglio:'Wellness'   }),
      apiFetch({ azione:'leggi_tutte_note' }).catch(() => ({ ok:true, note:[] })),
      apiFetch({ azione:'leggi_snapshot', w: curW }).catch(() => ({ ok:true, snapshot:null })),
    ]);

    giocatrici = (rg.dati||[]).filter(g => g.ID && g.Nome && String(g.ID) !== '99');
    progressi  = rp.dati || [];
    wellness   = rw.dati || [];
    noteCoach  = rn.note || [];
    approvedSnapshot = (rs.ok && rs.snapshot) ? rs.snapshot : null;

    const now       = new Date();
    const fetchTime = now.toLocaleTimeString('it-IT', { hour:'2-digit', minute:'2-digit' });
    const fetchDate = now.toLocaleDateString('it-IT', { day:'2-digit', month:'short' });

    document.getElementById('hdr-sub').textContent =
      approvedSnapshot
        ? `Snapshot approvato · W${curW} · ${giocatrici.length} atlete`
        : `Dati live da PROD · ${giocatrici.length} atlete · Scaricato ${fetchDate} alle ${fetchTime}`;
    document.getElementById('live-badge').textContent =
      approvedSnapshot ? `✓ Approvato · W${curW}` : `🔴 Live · W${curW}`;

    renderTabs();
    scheduleRefresh();

  } catch (err) {
    document.getElementById('page').innerHTML = `
      <div class="error-state">
        <div style="font-size:2rem;margin-bottom:12px">⚠️</div>
        <p style="color:var(--red);font-weight:600">Errore caricamento dati</p>
        <p style="color:var(--muted);font-size:.8rem;margin-top:6px">${esc(String(err))}</p>
        <button class="retry-btn" onclick="init()">Riprova</button>
      </div>`;
    document.getElementById('live-badge').textContent = '⚠ Errore';
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
